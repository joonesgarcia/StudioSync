services:
  postgres:
    image: postgres:17-alpine
    container_name: studiosync-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: studiosync
    ports:
      - "5432:5432"
    volumes:
      - studiosync-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d studiosync"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  studiosync-pgdata: